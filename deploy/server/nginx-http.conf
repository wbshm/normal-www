# Managed by normal-www deploy/server/setup.sh.
server {
    listen 80;
    listen [::]:80;
    server_name wangrq.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://wangrq.cn$request_uri;
    }
}
