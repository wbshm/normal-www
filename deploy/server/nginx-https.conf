# Managed by normal-www deploy/server/setup.sh.
server {
    listen 80;
    listen [::]:80;
    server_name wangrq.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://wangrq.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wangrq.cn;

    ssl_certificate /etc/letsencrypt/live/wangrq.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wangrq.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:normal_www_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/normal-www/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~ /\. {
        deny all;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
